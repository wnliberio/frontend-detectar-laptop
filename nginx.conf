# nginx.conf - Frontend con proxy al backend en Docker
# Ubicación: frontend-detectar/nginx.conf

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ===== HEALTH CHECK PARA DOCKER =====
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # ===== PROXY API AL BACKEND =====
    # CRÍTICO: Redirige todas las llamadas /api/* al contenedor backend-detectar
    # El nombre 'backend-detectar' es resuelto por Docker DNS en la red 'mupi'
    location /api/ {
        proxy_pass http://backend-detectar:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts para operaciones lentas (reportes, consultas BD)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ===== SPA FALLBACK - REACT ROUTER =====
    # Todas las rutas que no existen van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== CACHE PARA ASSETS ESTÁTICOS =====
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== COMPRESIÓN GZIP =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_disable "msie6";
}